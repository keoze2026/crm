name: Deploy to VPS

# Auto-deploy CallFlow CRM to the Hostinger VPS (crm.keozx.com) on every push to main.
# It SSHes into the box, fast-forwards the checkout to the pushed commit, then runs
# deploy.sh (build frontend + install backend deps + reload php-fpm/nginx).
on:
  push:
    branches: [main]
  workflow_dispatch: {}        # also allow a manual run from the Actions tab

# Never run two deploys at once; let an in-flight deploy finish before the next starts.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}       # optional; defaults to 22 if the secret is unset
          script_stop: true                   # abort on the first failing command
          command_timeout: 15m                # npm build can be slow on a small VPS
          script: |
            set -euo pipefail
            cd /var/www/crm_dash/crm
            git fetch origin main
            git reset --hard origin/main       # match the pushed commit exactly (ignores .env, dist, vendor)
            bash deploy.sh
