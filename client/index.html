<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM</title>
    <!-- The stored theme goes on <html> before anything paints, so a light session never
         flashes dark. Kept in step with lib/useTheme.ts (same key, same class). -->
    <script>
      try { if (localStorage.getItem('keoze-theme') === 'light') document.documentElement.classList.add('light') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
